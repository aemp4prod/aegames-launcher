name: Publier le launcher

on:
  push:
    tags:
      - "launcher-v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Compiler et publier la release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v0.5.0 — Mise à jour des statistiques"
          releaseBody: |
            ## Statistiques de jeu

            - Suivi automatique du temps de jeu, des sessions, des jours actifs et des séries.
            - Nouveau modal complet avec vue d'ensemble, graphiques interactifs, records et historique.
            - Filtres sur 7, 30 et 90 jours, un an ou toute la période.
            - Statistiques réutilisées sur l'accueil, la bibliothèque, la page Hype et les vitrines de profil.

            ## Profils et vitrines

            - Liste d'amis fiabilisée et entièrement visible sur les profils.
            - Étagères et vitrines réorganisables par glisser-déposer avec prévisualisation animée.
            - Menus déroulants remplacés par des composants personnalisés cohérents avec le thème.

            ## Interface

            - Barres de navigation homogènes avec le fond de page, assombrissement et flou adaptés.
            - Actualités non lues signalées par une pastille compacte « ✦ NOUVEAU ».
            - Carte de reprise basée sur le dernier jeu lancé et ses statistiques réelles.

            ## Installation de Hype

            - Emplacement du jeu mémorisé durablement entre les téléchargements et les redémarrages.
            - Suppression de la demande de dossier superflue lorsqu'une installation valide est déjà liée.

            ## Infrastructure

            - Réduction des écritures de présence et des requêtes responsables d'une consommation excessive des logs Supabase.

            L'installateur n'est pas encore signé avec un certificat Windows : un avertissement SmartScreen peut apparaître pendant cette phase de test interne.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis
