name: Publier le launcher

on:
  push:
    tags:
      - "launcher-v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Compiler et publier la release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Æ Games Launcher v0.3.0 — Mise à jour sociale"
          releaseBody: |
            ## Réseau social Æ Games

            - Nouvelle pilule d'amis avec total, présence en ligne et avatars prioritaires.
            - Listes séparées entre joueurs en jeu, en ligne et hors ligne.
            - Profils hors ligne en noir et blanc et activité de jeu synchronisée.
            - Menus de gestion unifiés pour ouvrir, supprimer, bloquer ou débloquer un profil.
            - Présence actualisée au lancement, pendant une session et à la fermeture du launcher.

            ## Profils publics et personnalisation

            - Nouvelle page de profil public détaillée et réactive.
            - Bio compatible Markdown avec barre d'outils et aperçu instantané.
            - Personnalisation du fond, des dégradés, de la couleur d'accent et de la transparence des cartes.
            - Recadrage des photos de profil et des bannières avant enregistrement.
            - Activité actuelle, univers Æ Games, informations sociales et identité visuelle du joueur.

            ## Actualités

            - Suivi des actualités lues, synchronisé par compte.
            - Notes de version GitHub rendues avec leur Markdown complet.
            - Titres, listes, tableaux, liens, citations, blocs de code et sauts de ligne pris en charge.
            - Illustration Hype repositionnée derrière le contenu.

            ## Interface et fiabilité

            - Barre supérieure et navigation latérale unifiées avec un fond translucide et flouté.
            - Taille minimale de la fenêtre recalculée selon l'échelle de l'interface.
            - Position de la fenêtre conservée lors d'un rafraîchissement avec Ctrl+R.
            - Fermeture de la fenêtre corrigée depuis la barre du launcher et la barre des tâches Windows.
            - Nombreux ajustements de typographie, de menus contextuels et de responsive design.

            L'installateur n'est pas encore signé avec un certificat Windows : un avertissement SmartScreen peut apparaître pendant cette phase de test interne.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis
