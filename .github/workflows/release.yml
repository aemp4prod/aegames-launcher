name: Publier le launcher

on:
  push:
    tags:
      - "launcher-v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Compiler et publier la release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Æ Games Launcher v0.4.0 — Mise à jour des succès"
          releaseBody: |
            ## Succès Hype

            - Sessions de succès sécurisées créées par le launcher et transmises uniquement au processus Hype.
            - Progression et déverrouillages synchronisés en temps réel depuis Supabase.
            - Notifications intégrées au launcher lors de l'obtention d'un succès.
            - Catalogue réel avec recherche, filtres fonctionnels, rareté et succès secrets.
            - Succès obtenus placés en premier et taux de complétion recalculé.

            ## Profils et vitrines

            - Les vitrines utilisent désormais les vrais succès Hype du joueur.
            - Seuls les succès débloqués par moins de 10 % des joueurs sont sélectionnables comme succès rares.
            - Les succès temporaires de L.A LifeRP ont été retirés.

            ## Versions et actualités Hype

            - Emplacement local du jeu conservé pendant les mises à jour et en cas d'échec.
            - Choix de la version Hype à installer, y compris les anciennes releases et préversions.
            - Historique complet des actualités GitHub avec recherche dans les titres, versions et notes.

            ## Mise à jour du launcher

            - Nouveau modal dédié avec notes GitHub rendues en Markdown.
            - Progression du téléchargement clairement affichée.
            - Confirmation demandée avant le redémarrage et l'installation.

            L'installateur n'est pas encore signé avec un certificat Windows : un avertissement SmartScreen peut apparaître pendant cette phase de test interne.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis
