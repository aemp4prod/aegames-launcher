name: Publier le launcher

on:
  push:
    tags:
      - "launcher-v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Compiler et publier la release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Æ Games Launcher v0.3.1 — Profils et vitrines"
          releaseBody: |
            ## Refonte complète des profils

            - Identité regroupée sous une bannière au ratio constant, sans voile assombrissant.
            - Édition du profil directement dans la page : photo, bannière, nom, pseudo, bio, statut et signature visuelle.
            - Liste complète des amis affichée sur le profil, quel que soit leur statut de présence.
            - Copie de la signature visuelle d'un autre joueur avec prévisualisation, validation et suppression.
            - Signatures prédéfinies recentrées sur les thèmes des jeux L.A LifeRP et Hype.

            ## Étagères et vitrines

            - Ajout, suppression et positionnement libre des étagères depuis le mode édition.
            - Une à trois vitrines par étagère, automatiquement alignées sur la même hauteur.
            - Sélection des univers favoris, succès rares et statistiques à afficher.
            - Carte grand format pour le jeu coup de cœur, avec choix du jeu.

            ## Interface et fiabilité

            - Barre supérieure et navigation latérale harmonisées avec le même noir translucide et le même flou.
            - Fonds de thèmes étendus sous toute l'interface et transitions de bibliothèque adoucies.
            - Changement de statut depuis le mini-profil corrigé.
            - Rafraîchissement en plein écran corrigé pour éviter le déplacement de la fenêtre.
            - Emplacement local de Hype préservé pendant la vérification et la mise à jour du jeu.

            ## Préparation des succès Hype

            - Schéma Supabase versionné pour les définitions, progressions, sessions et événements idempotents.
            - Documentation d'intégration fournie à l'équipe Hype pour le futur branchement au launcher.

            L'installateur n'est pas encore signé avec un certificat Windows : un avertissement SmartScreen peut apparaître pendant cette phase de test interne.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis
